name: build-windows

# Minimal "does the template still build against the pinned runtime?" check.
#
# The plug-in DLL links the runtime's public ABI (DisplayXRClient.lib + headers),
# which is produced by building displayxr-runtime. So this workflow checks out
# the runtime at the tag this template pins (CMakeLists.txt DXR_RUNTIME_GIT_TAG)
# as a sibling and lets scripts\build-windows.bat detect it via
# DXR_RUNTIME_SOURCE_DIR.
#
# Building the runtime from source pulls its vcpkg manifest deps (eigen3,
# glslang, vulkan, wil, pthreads, cjson). build-windows.bat wires the vcpkg
# toolchain + manifest dir ONLY when vcpkg lives inside the runtime checkout
# (it probes DXR_RUNTIME_SOURCE_DIR\vcpkg\scripts\buildsystems\vcpkg.cmake) — so
# run-vcpkg below checks vcpkg out into displayxr-runtime\vcpkg. The vcpkg commit
# is pinned to match the runtime's own build-windows.yml. The Vulkan SDK version
# is NOT — the runtime dropped the LunarG SDK step entirely in favour of vcpkg
# (vulkan-headers + vulkan-loader + glslang[tools]); this template still uses the
# LunarG action, so its pin has to be babysat (see "Install Vulkan SDK" below).
#
# VENDOR TODO: keep the runtime tag here (env RUNTIME_REF, plus the OpenXR loader
# rev) in sync with CMakeLists.txt DXR_RUNTIME_GIT_TAG — the "Rule-5 ABI pin
# self-check" step below hard-fails the build if they drift (ADR-020, mirroring
# displayxr-leia-plugin). Also update the DLL name in the final "confirm
# artifact" step when you rename drv_example -> drv_<vendor>.

on:
  push:
    branches: [main, master]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    env:
      # The displayxr-runtime release this template builds against. MUST equal
      # DXR_RUNTIME_GIT_TAG in CMakeLists.txt — enforced by the Rule-5 self-check
      # step below, so the two pins cannot silently drift.
      RUNTIME_REF: v2.7.1
    steps:
      - name: Checkout template
        uses: actions/checkout@v5
        with:
          path: template

      # Turns the "keep these in sync" comment into a build failure (ADR-020 rule 5).
      - name: Rule-5 ABI pin self-check
        shell: pwsh
        run: |
          $line = Select-String -Path 'template/CMakeLists.txt' -Pattern '^\s*set\(DXR_RUNTIME_GIT_TAG\s+"([^"]+)"' | Select-Object -First 1
          if (-not $line) {
            Write-Error "Rule-5 self-check: could not find DXR_RUNTIME_GIT_TAG in CMakeLists.txt"
            exit 1
          }
          $cmakeTag = $line.Matches[0].Groups[1].Value
          if ($cmakeTag -ne $env:RUNTIME_REF) {
            Write-Error "Rule-5 ABI pin drift: CMakeLists.txt has DXR_RUNTIME_GIT_TAG='$cmakeTag' but the workflow has RUNTIME_REF='$env:RUNTIME_REF'. Bump both together, or the plug-in gets built against one runtime ABI while CI proves nothing about the one it ships beside."
            exit 1
          }
          Write-Host "Rule-5 ABI pin OK: DXR_RUNTIME_GIT_TAG == RUNTIME_REF == $env:RUNTIME_REF"

      # KEEP IN SYNC with DXR_RUNTIME_GIT_TAG in template/CMakeLists.txt —
      # enforced by the Rule-5 self-check step above.
      - name: Checkout pinned displayxr-runtime (sibling)
        uses: actions/checkout@v5
        with:
          repository: DisplayXR/displayxr-runtime
          ref: ${{ env.RUNTIME_REF }}
          submodules: recursive
          path: displayxr-runtime

      # vcpkg lives INSIDE the runtime checkout so build-windows.bat auto-wires
      # its toolchain + manifest. Pin matches displayxr-runtime/build-windows.yml.
      - name: Setup vcpkg (inside runtime checkout)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/displayxr-runtime/vcpkg'
          vcpkgGitCommitId: '5d90b0d5d0317336e65662f2bf0d671b0902c632'
          vcpkgJsonGlob: 'displayxr-runtime/vcpkg.json'

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          # PIN WILL ROT. LunarG serves only the ~16 newest SDK releases and
          # deletes the installers for older ones. 1.3.283.0 — this template's
          # original pin — started returning a hard 404 on 2026-08-17 and broke
          # six sibling repos with "curl failed with error code: 22"; re-running
          # cannot help. 1.3.296.0 is next in line to age out.
          # See DisplayXR/displayxr-runtime#1029.
          #
          # Do NOT "fix" this with `version: latest`. From SDK 1.4.313.0 onward
          # LunarG repackaged the Windows installer, and this action's naive
          # `7z x vulkan_sdk.exe` then extracts only Bin/ — no Include/, no Lib/.
          # The step still reports GREEN (it only runs glslangValidator
          # --version), and the build dies much later at find_package(Vulkan) /
          # Vulkan::Vulkan. Verified complete: 1.3.290.0, 1.4.304.0, 1.4.309.0.
          # Verified Bin/-only: 1.4.313.2, 1.4.321.1, 1.4.335.0, 1.4.357.0
          # (= `latest`). 1.4.309.0 is the NEWEST version that still unpacks a
          # complete SDK.
          #
          # When this 404s, pick a newer version from
          #   https://vulkan.lunarg.com/sdk/versions/windows.json
          # and verify BOTH that it downloads AND that it unpacks Include/+Lib/:
          #   curl -I https://sdk.lunarg.com/sdk/download/<ver>/windows/vulkan_sdk.exe
          # Better: drop the LunarG SDK for vcpkg, as displayxr-runtime already
          # has (vulkan-headers + vulkan-loader + glslang[tools]) — immutable
          # pins, cannot rot. Tracked in displayxr-runtime#1029.
          version: 1.4.309.0
          cache: true

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja -y

      - name: Provision OpenXR loader into the runtime sibling
        shell: pwsh
        run: |
          # build-windows.bat adds -DOpenXR_ROOT when
          # displayxr-runtime\openxr_sdk\x64\lib\openxr_loader.lib exists. Match
          # the loader rev the runtime's own CI uses at RUNTIME_REF (1.1.51 at
          # v2.7.1) — bump this together with RUNTIME_REF.
          $ver = '1.1.51'
          $url = "https://github.com/KhronosGroup/OpenXR-SDK-Source/releases/download/release-$ver/openxr_loader_windows-$ver.zip"
          Invoke-WebRequest -Uri $url -OutFile openxr_loader.zip
          Expand-Archive -Path openxr_loader.zip -DestinationPath openxr_extract -Force
          # The Khronos zip nests everything under openxr_loader_windows-<ver>/;
          # flatten so x64/ lands directly under openxr_sdk/.
          $nested = Join-Path openxr_extract "openxr_loader_windows-$ver"
          $src = (Test-Path (Join-Path $nested 'x64')) ? $nested : 'openxr_extract'
          New-Item -ItemType Directory -Force -Path displayxr-runtime/openxr_sdk | Out-Null
          Copy-Item -Path (Join-Path $src '*') -Destination displayxr-runtime/openxr_sdk -Recurse -Force

      - name: Build plug-in against the pinned runtime
        shell: cmd
        env:
          DXR_RUNTIME_SOURCE_DIR: ${{ github.workspace }}\displayxr-runtime
        run: |
          cd template
          call scripts\build-windows.bat build

      - name: Confirm plug-in DLL was produced
        shell: pwsh
        run: |
          $dll = 'template/_package/bin/plugins/DisplayXR-ExampleVendor.dll'
          if (-Not (Test-Path $dll)) {
            Write-Error "Plug-in DLL not found at $dll"
            exit 1
          }
          Write-Host "Built $dll"
